<div class="management-user-group-table">
  <div class="management-user-group-table-body table-split">
    <div class="table-split-head">
      <table
        border="0"
        cellpadding="0"
        cellspacing="0"
        TableSorter
        (sort)="on.sort($event)"
      >
        <colgroup>
          <col [ngStyle]="{ width: width }" *ngFor="let width of widths" />
        </colgroup>
        <thead>
          <tr>
            <th class="center">
              <input
                type="checkbox"
                [checked]="
                  selecteds.length > 0 && selecteds.length === datas.length
                "
                (change)="select.all()"
              />
            </th>
            <th sort="GroupId" class="center">序号</th>
            <th sort="GroupName">分组名称</th>
            <th>区划</th>
            <th class="center">操作</th>
          </tr>
        </thead>
      </table>
    </div>
    <div class="table-split-body">
      <table border="0" cellpadding="0" cellspacing="0">
        <colgroup>
          <col [ngStyle]="{ width: width }" *ngFor="let width of widths" />
        </colgroup>
        <tbody>
          <tr
            *ngFor="let item of datas; let index = index"
            (click)="select.item(item)"
            [ngClass]="{
              selected: selecteds.includes(item),
            }"
          >
            <td class="center">
              <input type="checkbox" [checked]="selecteds.includes(item)" />
            </td>
            <td class="center">
              <div>{{ index + 1 }}</div>
            </td>
            <td [title]="item.GroupName">
              {{ item.GroupName }}
            </td>
            <td [title]="item.DivisionNames?.join('、')">
              {{ item.DivisionNames?.join("、") || "-" }}
            </td>
            <td class="center">
              <div class="operation">
                <div
                  class="button"
                  title="编辑"
                  (click)="on.modify(item, $event)"
                >
                  <i class="howell-icon-modification"></i>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
