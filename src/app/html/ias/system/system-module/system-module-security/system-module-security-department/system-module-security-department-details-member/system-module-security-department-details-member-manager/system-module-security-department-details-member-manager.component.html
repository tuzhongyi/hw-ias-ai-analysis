<div class="system-module-security-department-details-member-manager root-router">
  <div class="panel panel-flex">
    <div class="panel-head">
      <div class="panel-title">部门员工</div>
      <div class="button-group">
        <button
          class="button-clip-gradient"
          (click)="on.import()"
          *ngIf="!importing"
        >
          导入
        </button>
        <button class="button-clip-gradient" (click)="on.create()">新建</button>
      </div>
    </div>
    <div class="panel-body">
      <ias-system-module-security-department-details-member-table
        [args]="args"
        [load]="load"
        (update)="on.update($event)"
        (delete)="on.delete($event)"
      >
      </ias-system-module-security-department-details-member-table>
    </div>
  </div>
</div>
