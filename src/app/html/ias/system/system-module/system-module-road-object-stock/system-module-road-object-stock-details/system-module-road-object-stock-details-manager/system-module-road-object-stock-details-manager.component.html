<div class="system-module-road-object-stock-details-manager">
  <div class="system-module-road-object-stock-details-manager-body">
    <div class="system-module-road-object-stock-details-medium">
      <div
        class="system-module-road-object-stock-details-image panel"
        [class.hide]="image.hidden"
      >
        <ias-system-module-road-object-details-image
          [url]="model.ImageUrl"
          [load]="image.load"
          (upload)="image.upload($event)"
          (picture)="image.open()"
        ></ias-system-module-road-object-details-image>
      </div>
      <div class="system-module-road-object-stock-details-map panel">
        <ng-container *ngIf="In.point()">
          <ias-system-module-road-object-details-map
            [(position)]="map.point.gcj02"
            (positionChange)="map.point.on.gcj02($event)"
            [type]="map.type"
            [get]="map.point.get"
            (error)="on.error($event)"
          ></ias-system-module-road-object-details-map>
        </ng-container>
        <ng-container *ngIf="In.line()">
          <ias-system-module-road-object-details-map-line
            [datas]="map.line.datas"
            [creating]="map.line.creating()"
            [editing]="map.line.editing()"
            (inited)="map.line.on.inited()"
          >
          </ias-system-module-road-object-details-map-line>
        </ng-container>
        <div class="system-module-road-object-stock-details-map-buttons">
          <div
            class="button panel-map"
            *ngIf="!image.hidden"
            (click)="image.hidden = true"
          >
            <i class="mdi mdi-arrow-expand"></i>
          </div>
          <div
            class="button panel-map"
            *ngIf="image.hidden"
            (click)="image.hidden = false"
          >
            <i class="mdi mdi-arrow-collapse"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="system-module-road-object-stock-details-info panel panel-flex">
      <div class="panel-head">
        <div class="panel-title">基本信息</div>
      </div>
      <div class="panel-body">
        <ias-system-module-road-object-stock-details-info
          [data]="model"
          (dataChange)="on.change($event)"
          [(wgs84)]="map.point.wgs84"
          (wgs84Change)="map.point.on.wgs84($event)"
          (locate)="map.point.locate()"
          [operable]="operable"
        ></ias-system-module-road-object-stock-details-info>
      </div>
    </div>
  </div>
  <div
    class="system-module-road-object-stock-details-manager-foot button-group"
  >
    <button class="button-clip-gradient" (click)="on.create()" *ngIf="!data">
      确定
    </button>
    <button class="button-clip-gradient" (click)="on.update()" *ngIf="data">
      确定
    </button>
    <button class="button-clip-blue" (click)="on.cancel()">取消</button>
  </div>
</div>
