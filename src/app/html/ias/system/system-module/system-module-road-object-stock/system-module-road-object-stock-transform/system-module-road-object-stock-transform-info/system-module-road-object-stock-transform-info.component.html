<div class="system-module-road-object-stock-transform-info">
  <div class="forms">
    <div class="form-item">
      <div class="form-item-text">
        <div class="name" text-space-between>部件类型</div>
        <div class="must">*</div>
      </div>
      <div class="form-item-value fill">
        <hw-select
          [nullable]="false"
          [(selected)]="data.ObjectType"
          (selectedChange)="on.change()"
        >
          <select [(ngModel)]="data.ObjectType">
            <ng-container *ngFor="let item of source.types">
              @if (operable) {
                <option [ngValue]="item.Value">{{ item.Name }}</option>
              } @else {
                <option
                  [ngValue]="item.Value"
                  *ngIf="item.Value == data.ObjectType"
                >
                  {{ item.Name }}
                </option>
              }
            </ng-container>
          </select>
        </hw-select>
      </div>
    </div>
    <div class="form-item">
      <div class="form-item-text">
        <div class="name" text-space-between>行政区划</div>
        <div class="must">*</div>
      </div>
      <div class="form-item-value fill">
        <hw-select [(selected)]="data.DivisionId" [nullable]="false">
          <select [(ngModel)]="data.DivisionId" (change)="on.change()">
            <ng-container *ngFor="let item of source.divisions | async">
              @if (operable) {
                <option [ngValue]="item.Id">{{ item.Name }}</option>
              } @else {
                <option [ngValue]="item.Id" *ngIf="item.Id == data.DivisionId">
                  {{ item.Name }}
                </option>
              }
            </ng-container>
          </select>
        </hw-select>
      </div>
    </div>
    <div class="form-item">
      <div class="form-item-text">
        <div class="name" text-space-between>连续消失次数</div>
        <div class="must">*</div>
      </div>
      <div class="form-item-value">
        <input
          type="number"
          min="1"
          wheel-input-number
          [(ngModel)]="data.DisappearTimes"
          [disabled]="!operable"
        />
      </div>
    </div>
    <div class="form-item">
      <div class="form-item-text">
        <div class="name" text-space-between>责任网格</div>
        <div class="must">*</div>
      </div>
      <div class="form-item-value fill">
        <hw-select [(selected)]="data.GridCellId" [nullable]="false">
          <select [(ngModel)]="data.GridCellId" (change)="on.change()">
            <ng-container *ngFor="let item of source.gridcells | async">
              @if (operable) {
                <option [ngValue]="item.Id">{{ item.Name }}</option>
              } @else {
                <option [ngValue]="item.Id" *ngIf="item.Id == data.GridCellId">
                  {{ item.Name }}
                </option>
              }
            </ng-container>
          </select>
        </hw-select>
      </div>
    </div>
  </div>
</div>
