<div class="system-module-road-area-info root-router">
  <div class="forms">
    <div class="form-item single">
      <div class="form-item-text" text-space-between>区域名称</div>
      <div class="form-item-value">
        <input type="text" [(ngModel)]="data.Name" (change)="on.change()" />
      </div>
    </div>

    <div class="form-item single">
      <div class="form-item-text" text-space-between>用途</div>
      <div class="form-item-value fill">
        <hw-select [(selected)]="data.UsageType" [nullable]="false">
          <select [(ngModel)]="data.UsageType" (change)="on.change()">
            <option
              [ngValue]="item.Value"
              *ngFor="let item of source.usageTypes"
            >
              {{ item.Name }}
            </option>
          </select>
        </hw-select>
      </div>
    </div>

    <div class="form-item full">
      <div class="form-item-text" text-space-between>事件类型</div>
      <div class="form-item-value fill">
        <howell-select-multiple
          [datas]="source.events"
          [selecteds]="event.selected"
          (selectedsChange)="event.change($event)"
          [searchable]="false"
        ></howell-select-multiple>
      </div>
    </div>

    <div class="form-item full">
      <div class="form-item-text baseline textarea" text-space-between>
        描述
      </div>
      <div class="form-item-value">
        <textarea
          [(ngModel)]="data.Description"
          (change)="on.change()"
        ></textarea>
      </div>
    </div>
  </div>
</div>
